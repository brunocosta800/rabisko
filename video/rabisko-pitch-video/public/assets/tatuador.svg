<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cabeça do tatuador (perfil, olhando pra baixo) -->
  <circle cx="78" cy="62" r="22" />
  <!-- Touca/cabelo preso pra trás -->
  <path d="M 60 56 Q 56 38 76 36 Q 100 36 100 58" />
  <!-- Pescoço e tronco curvado pra frente sobre o trabalho -->
  <path d="M 80 84 L 84 110 Q 88 140 110 152" />
  <!-- Costas -->
  <path d="M 70 84 Q 62 110 60 140 Q 60 170 80 178" />
  <!-- Quadril e perna -->
  <path d="M 80 178 L 70 210" />
  <path d="M 90 178 L 95 220" />
  <!-- Braço dianteiro segurando a máquina (estendido pra direita) -->
  <path d="M 100 116 L 130 124 L 158 138" />
  <!-- Outro braço apoiado no joelho -->
  <path d="M 96 122 L 80 152" />
  <!-- Máquina de tatuagem na mão (formato em L estilizado) -->
  <g transform="translate(155 130) rotate(35)">
    <!-- Corpo da máquina -->
    <rect x="0" y="0" width="34" height="20" rx="2" />
    <!-- Bobinas (dois círculos) -->
    <circle cx="10" cy="-4" r="5" fill="#000000" />
    <circle cx="24" cy="-4" r="5" fill="#000000" />
    <!-- Tubo -->
    <rect x="14" y="20" width="8" height="14" />
    <!-- Agulha -->
    <line x1="18" y1="34" x2="18" y2="44" stroke-width="3" />
  </g>
  <!-- Antebraço do cliente sendo tatuado (linha horizontal abaixo) -->
  <path d="M 130 188 Q 170 192 210 188" stroke-dasharray="0" />
  <path d="M 132 200 Q 170 204 208 200" />
  <!-- Pequenos detalhes do "rabisco" sendo feito -->
  <path d="M 175 184 L 178 178 L 182 184 L 185 178" stroke-width="3" />
</svg>
